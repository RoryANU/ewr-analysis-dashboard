[project]
name = "ewr-analysis-dashboard"
version = "0.0.0"
description = "EWR analysis dashboard"
requires-python = ">=3.11"
# runtime dependencies live in requirements.txt / requirements-dev.txt; this table only describes the project to tools
[tool.ruff]
# Target Python version
target-version = "py311"
# The code base writes long, dense lines (data-pipeline one-liners with trailing comments); 160 keeps the formatter from
# exploding them while still bounding line length.
line-length = 160

[tool.ruff.lint]
# Select linter rules (e.g., Pyflakes, pycodestyle, Isort, Bugbear)
select = ["E", "F", "I", "B", "W", "UP", "PIE", "PLE"]
ignore = []

# Allow fix behavior by default
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# the tests put src/ on sys.path before importing it
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
strict_equality = true
show_error_codes = true
pretty = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
minversion = "9.0"
xfail_strict = true
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "slow: runs py_ewr end to end or rebuilds the dashboard (excluded from the pre-commit hook; run with `pytest`, skip with `-m 'not slow'`)",
    "network: needs internet (skipped when GitHub is unreachable)",
]
