[tool.ruff]
# Target Python version
target-version = "py311"
# The code base writes long, dense lines (data-pipeline one-liners with trailing comments); 160 keeps the formatter from
# exploding them while still bounding line length.
line-length = 160
# the Databricks notebook is user-facing and relies on notebook globals (dbutils); it is not part of the checked code
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Select linter rules (e.g., Pyflakes, pycodestyle, Isort, Bugbear)
select = ["E", "F", "I", "B"]
# B905: zip() pairs equal-length columns throughout; an explicit strict= on every call adds noise without catching anything.
# E731: small local lambdas (formatters, column pickers) are an established idiom in this code base.
ignore = ["B905", "E731"]

# Allow fix behavior by default
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# the tests put src/ on sys.path before importing it
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs py_ewr end to end or rebuilds the dashboard (excluded from the pre-commit hook; run with `pytest`, skip with `-m 'not slow'`)",
]
